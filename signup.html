<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Air University Food Ordering</title>
  <link rel="icon" href="download.jpg" type="image/jpeg">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000c1a url('https://www.transparenttextures.com/patterns/stardust.png');
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #f0f0f0;
    }

    .signup-box {
      background: rgba(0, 10, 20, 0.95);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      width: 340px;
      box-shadow: 0 4px 20px rgba(0, 85, 255, 0.5);
    }

    .signup-box img {
      width: 70px;
      margin-bottom: 1rem;
    }

    .signup-box h1 {
      margin: 0;
      font-size: 1.2rem;
      color: #3399ff;
      text-transform: uppercase;
    }

    .signup-box h3 {
      margin: 0.3rem 0 1.5rem;
      font-size: 0.9rem;
      font-weight: normal;
      color: #aaa;
    }

    .signup-box input,
    .signup-box select,
    .signup-box button {
      width: 100%;
      height: 45px;
      margin-bottom: 1rem;
      border: 1px solid #333;
      border-radius: 6px;
      background: #111a2a;
      color: #f0f0f0;
      padding: 0 0.75rem;
      box-sizing: border-box;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .signup-box input:focus,
    .signup-box select:focus {
      outline: none;
      border-color: #3399ff;
      background: #1a2b3f;
    }

    .signup-box button {
      background: #0066cc;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .signup-box button:hover {
      background: #0052a3;
      box-shadow: 0 0 10px #007bff88;
    }

    .signup-box a {
      display: block;
      margin-top: 0.75rem;
      color: #88aacc;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .signup-box a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="signup-box">
    <img src="logo.jpg" alt="Logo" />
    <h1>AIR UNIVERSITY FOOD ORDERING SYSTEM</h1>
    <h3>Create your account</h3>

    <!-- Sign Up Form -->
    <form action="signup.php" method="post">
      <input type="text" name="username" placeholder="Username" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <input type="password" name="confirm_password" placeholder="Confirm Password" required />

      <select name="role" required>
        <option value="" disabled selected>Select Role</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>

      <button type="submit">SIGN UP</button>
    </form>

    <a href="login.html">Already have an account? Login</a>
  </div>

</body>
</html>
