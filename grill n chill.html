<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GRILL AND CHILL - Order Menu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    header {
      background-color: #0C53A6;
      padding: 1rem;
      text-align: center;
      color: white;
    }

    main.menu {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .category-filter {
      text-align: center;
      margin-bottom: 2rem;
    }

    .category-filter label {
      font-weight: bold;
      margin-right: 0.5rem;
    }

    .category-filter select {
      background: #1b1b1b;
      color: white;
      border: 1px solid #0C53A6;
      border-radius: 4px;
      padding: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .menu-item {
      background: #1b1b1b;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      text-align: center;
    }

    .menu-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .menu-item h3 {
      color: #0C53A6;
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }

    .menu-item p {
      font-weight: bold;
      margin: 0.5rem 0;
      color: #ffffff;
    }

    .menu-item button,
    button.place-clear {
      background: #0C53A6;
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 1rem;
      transition: background 0.3s ease;
    }

    .menu-item button:hover,
    button.place-clear:hover {
      background: #003D82;
    }

    #cart {
      list-style: none;
      padding: 0;
      margin-bottom: 1rem;
    }

    #cart li {
      margin-bottom: 0.5rem;
    }

    #cart button {
      background: #0C53A6;
      border: none;
      color: white;
      padding: 0 0.5rem;
      margin-left: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    #cart button:hover {
      background: #003D82;
    }

    footer {
      background: #0C53A6;
      color: white;
      padding: 1rem;
      text-align: center;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>GRILL AND CHILL</h1>
    <p>Delicious bites and bold brews to fuel your day!</p>
  </header>

  <main class="menu">
    <h2>Menu</h2>

    <div class="category-filter">
      <label for="category">Choose a category:</label>
      <select id="category" onchange="filterMenu()">
        <option value="all">All</option>
        <option value="burgers">Burgers</option>
        <option value="sandwiches">Sandwiches</option>
        <option value="beverages">Beverages</option>
        <option value="desserts">Desserts</option>
      </select>
    </div>

    <div class="menu-grid" id="menuGrid"></div>

    <h2>Cart</h2>
    <ul id="cart"></ul>
    <p><strong>Total:</strong> ₨<span id="total">0.00</span></p>
    <button class="place-clear" onclick="placeOrder()">Place Order</button>
    <button class="place-clear" onclick="clearCart()">Clear Cart</button>

    <!-- Hidden form to submit the order -->
    <form id="orderForm" action="place_order.php" method="post" style="display:none;"></form>
  </main>

  <footer>
    <p>&copy; 2025 Grill and Chill. Part of the University Food Court.</p>
  </footer>

  <script>
    const menuItems = [
      { id: 25, name: 'Burger', price: 350, category: 'burgers', image: 'img/burger 3.jpg' },
      { id: 26, name: 'Grilled Cheese Sandwich', price: 300, category: 'sandwiches', image: 'img/grilled cheese 3.jpg' },
      { id: 27, name: 'Chicken Sandwich', price: 450, category: 'sandwiches', image: 'img/chicken sandwhich 3.jpg' },
      { id: 28, name: 'Veggie Wrap', price: 400, category: 'sandwiches', image: 'img/veggie wrap 3.jpg' },
      { id: 29, name: 'Latte', price: 325, category: 'beverages', image: 'img/latte 3.jpg' },
      { id: 30, name: 'Mocha', price: 350, category: 'beverages', image: 'img/mocha 3.jpg' },
      { id: 31, name: 'Iced Tea', price: 375, category: 'beverages', image: 'img/iced tea 3.jpg' },
      { id: 32, name: 'Cappuccino', price: 425, category: 'beverages', image: 'img/cappucino 3.jpg' },
      { id: 33, name: 'Chocolate Muffin', price: 200, category: 'desserts', image: 'img/c muffin 3.jpg' },
      { id: 34, name: 'Blueberry Muffin', price: 300, category: 'desserts', image: 'img/b mufin 3.jpg' },
      { id: 35, name: 'Brownie', price: 300, category: 'desserts', image: 'img/brownie 3.jpg' },
      { id: 36, name: 'Glazed Doughnuts', price: 250, category: 'desserts', image: 'img/doughnuts 3.jpg' }
    ];

    const cart = [];

    function displayMenu(items) {
      const menuGrid = document.getElementById('menuGrid');
      menuGrid.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'menu-item';
        div.innerHTML = `
          <img src="${item.image}" alt="${item.name}" />
          <h3>${item.name}</h3>
          <p>₨${item.price}</p>
          <button onclick="addToCart(${item.id}, '${item.name}', ${item.price})">Add to Cart</button>
        `;
        menuGrid.appendChild(div);
      });
    }

    function filterMenu() {
      const category = document.getElementById('category').value;
      if (category === 'all') {
        displayMenu(menuItems);
      } else {
        const filtered = menuItems.filter(item => item.category === category);
        displayMenu(filtered);
      }
    }

    function addToCart(id, name, price) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ id, name, price, quantity: 1 });
      }
      updateCart();
    }

    function updateCart() {
      const cartList = document.getElementById('cart');
      const totalDisplay = document.getElementById('total');
      cartList.innerHTML = '';
      let total = 0;

      cart.forEach(({ id, name, price, quantity }, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          ${name} - ₨${price} x ${quantity} = ₨${(price * quantity).toFixed(2)}
          <button onclick="decreaseQuantity(${index})">-</button>
          <button onclick="increaseQuantity(${index})">+</button>
        `;
        cartList.appendChild(li);
        total += price * quantity;
      });

      totalDisplay.textContent = total.toFixed(2);
    }

    function increaseQuantity(index) {
      cart[index].quantity++;
      updateCart();
    }

    function decreaseQuantity(index) {
      if (cart[index].quantity > 1) {
        cart[index].quantity--;
      } else {
        cart.splice(index, 1);
      }
      updateCart();
    }

    function clearCart() {
      cart.length = 0;
      updateCart();
    }

    function placeOrder() {
      if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
      }

      const orderForm = document.getElementById('orderForm');
      orderForm.innerHTML = '';

      cart.forEach(({ id, quantity }) => {
        for (let i = 0; i < quantity; i++) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'food_ids[]';
          input.value = id;
          orderForm.appendChild(input);
        }
      });

      const totalInput = document.createElement('input');
      totalInput.type = 'hidden';
      totalInput.name = 'total';
      totalInput.value = parseFloat(document.getElementById('total').textContent);
      orderForm.appendChild(totalInput);

      orderForm.submit();
    }

    displayMenu(menuItems);
  </script>
</body>
</html>
